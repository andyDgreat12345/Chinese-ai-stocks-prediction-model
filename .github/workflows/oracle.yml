name: Oracle

# Zero-server deployment: run the daily jobs on a schedule, persist the growing
# SQLite state on the `oracle-state` branch, build the static dashboard, and
# publish it to GitHub Pages. See GITHUB_PAGES.md for one-time setup.
#
# NOTE: scheduled runs only fire once this workflow is on the repo's DEFAULT
# branch (merge the PR first). Times are UTC; the app is CST (UTC+8).

on:
  schedule:
    - cron: "0 21 * * *"   # 05:00 CST — morning: US close + news + analysis
    - cron: "15 7 * * *"   # 15:15 CST — afternoon: China close + reflection
  workflow_dispatch:
    inputs:
      phase:
        description: "Which phase to run"
        type: choice
        default: all
        options: [all, morning, afternoon, backfill, backtest, research]

permissions:
  contents: write   # push the oracle-state branch
  pages: write      # deploy to Pages
  id-token: write   # Pages OIDC
  issues: write     # post the daily action report as an issue (emails the user)

concurrency:
  group: oracle
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      ORACLE_DB: ${{ github.workspace }}/_state/oracle.db
      ORACLE_REFLECTION_LOG: ${{ github.workspace }}/_state/reflection_log.jsonl
      ORACLE_MACRO_FILE: ${{ github.workspace }}/_state/macro_events.json
      # Optional LLM reflection backend (spec §4b-iii). Leave unset for the
      # deterministic rule-based reflection. To enable: set repo variable
      # ORACLE_LLM_PROVIDER (claude|deepseek) and the matching API-key secret.
      ORACLE_LLM_PROVIDER: ${{ vars.ORACLE_LLM_PROVIDER }}
      ORACLE_LLM_MODEL: ${{ vars.ORACLE_LLM_MODEL }}
      # Optional AI research desk (spec §4.2). Enable by setting repo variable
      # ORACLE_ANALYST_PROVIDER (deepseek|claude) + the matching API-key secret.
      # Off by default → the rule-based prediction runs alone.
      ORACLE_ANALYST_PROVIDER: ${{ vars.ORACLE_ANALYST_PROVIDER }}
      ORACLE_ANALYST_MODEL: ${{ vars.ORACLE_ANALYST_MODEL }}
      # Multi-pass reasoning chain (thesis → sector deep-dive → risk). Set repo
      # variable ORACLE_ANALYST_MODE=chain to enable (~3× token cost, shown on the
      # spend meter); leave unset for the single-pass analyst. ORACLE_ANALYST_THESIS_MODEL
      # optionally runs pass 1 on a reasoning model, e.g. deepseek-reasoner.
      ORACLE_ANALYST_MODE: ${{ vars.ORACLE_ANALYST_MODE }}
      ORACLE_ANALYST_THESIS_MODEL: ${{ vars.ORACLE_ANALYST_THESIS_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # Optional live web search that augments the AI analyst (spec §4.2). DeepSeek's
      # API has no web search, so we run it ourselves and feed results into the
      # prompt. Off unless set: repo variable ORACLE_SEARCH_PROVIDER (tavily|brave)
      # + the matching key secret. Optional per-query price for the meter.
      # Near-real-time quote snapshots for the picked names (Sina). Fully
      # fail-soft; on by default here, disable by setting the variable to "off".
      ORACLE_QUOTES_PROVIDER: ${{ vars.ORACLE_QUOTES_PROVIDER || 'sina' }}
      ORACLE_SEARCH_PROVIDER: ${{ vars.ORACLE_SEARCH_PROVIDER }}
      ORACLE_SEARCH_PRICE_PER_QUERY: ${{ vars.ORACLE_SEARCH_PRICE_PER_QUERY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore persisted state
        run: |
          mkdir -p _state
          if git ls-remote --exit-code --heads origin oracle-state >/dev/null 2>&1; then
            git fetch -q --depth=1 origin oracle-state
            git archive FETCH_HEAD | tar -x -C _state
            echo "restored state from oracle-state branch"
          else
            echo "no oracle-state branch yet — starting fresh"
          fi
          # Seed the macro calendar on first run if none persisted.
          if [ ! -f _state/macro_events.json ] && [ -f examples/macro_events.sample.json ]; then
            cp examples/macro_events.sample.json _state/macro_events.json
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Determine phase
        id: phase
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "phase=${{ github.event.inputs.phase }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 21 * * *" ]; then
            echo "phase=morning" >> "$GITHUB_OUTPUT"
          else
            echo "phase=afternoon" >> "$GITHUB_OUTPUT"
          fi

      - name: Run jobs (${{ steps.phase.outputs.phase }})
        run: |
          phase="${{ steps.phase.outputs.phase }}"
          case "$phase" in
            backfill)                    # one-time: load history, then show the backtest
              python -m oracle.backfill 365
              python -m oracle.backtest ;;
            backtest)                    # just print the evaluation report to the log
              python -m oracle.backtest ;;
            research)                    # wide US<->China correlation sweep + report
              python -m oracle.research.run 400 --out research_report.md
              cp research_report.md _state/research_report.md
              # Does Chinese news sentiment predict the next session? Reports
              # "not measured yet" plus a detectability table until the history
              # is long enough — never an empty result posing as a null one.
              python -m oracle.research.news_signal > news_signal_report.md || true
              cp news_signal_report.md _state/news_signal_report.md || true ;;
            *)                           # morning / afternoon / all daily jobs
              python -m oracle.run "$phase" ;;
          esac

      - name: Deliver daily action report (morning only — right after the US close)
        # Merges the rule-based prediction and the AI analyst into one plain
        # "lean constructive / lean cautious" outlook and posts it as an issue;
        # the @mention makes GitHub email it to the user (same zero-credential
        # path as the weekly digest — no SMTP secret needed).
        if: steps.phase.outputs.phase == 'morning' || steps.phase.outputs.phase == 'all'
        env:
          GH_TOKEN: ${{ github.token }}
          MENTION: ${{ vars.DIGEST_MENTION || github.repository_owner }}
        run: |
          {
            echo "Hi @${MENTION} —"
            echo
            python -m oracle.report --md || echo "(daily report unavailable this run)"
          } > report.md
          cat report.md
          title="China Market Oracle — daily outlook ($(date -u +%F))"
          if ! gh issue create --repo "${{ github.repository }}" \
                --title "$title" --body-file report.md --label daily-outlook 2>/tmp/err; then
            # A fresh repo may not have the 'daily-outlook' label yet — retry without it.
            if grep -qi "label" /tmp/err; then
              gh issue create --repo "${{ github.repository }}" \
                --title "$title" --body-file report.md
            else
              cat /tmp/err >&2; exit 1
            fi
          fi

      - name: Build static site
        run: python -m oracle.site_build site

      - name: Persist state
        run: |
          cd _state
          git init -q
          git add -A
          git -c user.name="oracle-bot" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "state: ${{ steps.phase.outputs.phase }} $(date -u +%FT%TZ)" \
            || { echo "no state changes"; exit 0; }
          git push -q -f \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            HEAD:oracle-state

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deploy
        continue-on-error: true   # a not-yet-enabled Pages must not fail the data run
        uses: actions/deploy-pages@v4

      - name: Pages setup hint
        if: steps.deploy.outcome != 'success'
        run: |
          echo "::warning::Dashboard not published — enable GitHub Pages "\
               "(Settings → Pages → Source: 'GitHub Actions') then re-run. "\
               "The data jobs, backtest, and state persistence already succeeded."
