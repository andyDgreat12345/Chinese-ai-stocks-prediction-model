name: Weekly digest

# Posts a weekly backtest digest — how the model, the naive baselines, and the
# optional AI analyst ("llm (recorded)") are tracking — as a GitHub Issue, and
# @mentions the repo owner so GitHub emails it straight to their inbox.
#
# WHY AN ISSUE INSTEAD OF SMTP EMAIL:
#   Sending a real email requires a mailbox's password (a Gmail app password,
#   etc.) stored as a secret — a hassle, and Google kept rejecting it. Opening an
#   issue needs NO credentials at all: it uses the built-in GITHUB_TOKEN. GitHub's
#   own notification system then delivers the digest to whatever address you pick.
#
# ONE-TIME SETUP (no secrets to add) — just point GitHub notifications at your
# inbox, then the digest arrives as an email every Monday:
#   1. github.com/settings/emails        → add & verify tianyisun2009@outlook.com
#   2. github.com/settings/notifications → set "Default notification email" to it
#      (and make sure "Email" is ticked for Participating, @mentions, and pushes).
# Because the issue @mentions the owner, the email arrives even without watching
# the repo. The backtest runs against the state the daily Oracle jobs persist on
# the `oracle-state` branch; it degrades gracefully to a "no data yet" digest
# before those runs have accumulated anything.

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch: {}    # run on demand to test

permissions:
  contents: read           # to fetch the persisted oracle-state branch
  issues: write            # to open the weekly digest issue

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      # Who gets @mentioned (and therefore emailed). The repo owner by default —
      # override by setting repo variable DIGEST_MENTION to a GitHub username.
      MENTION: ${{ vars.DIGEST_MENTION || github.repository_owner }}
      ORACLE_DB: ${{ github.workspace }}/_state/oracle.db
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore persisted state
        run: |
          mkdir -p _state
          if git ls-remote --exit-code --heads origin oracle-state >/dev/null 2>&1; then
            git fetch -q --depth=1 origin oracle-state
            git archive FETCH_HEAD | tar -x -C _state
            echo "restored state from oracle-state branch"
          else
            echo "no oracle-state branch yet — the digest will report 'no data yet'"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the digest (backtest is stdlib-only — no pip install needed)
        run: |
          {
            echo "Hi @${MENTION} — here is this week's China Market Oracle digest ($(date -u +%F))."
            echo
            echo '```'
            python -m oracle.backtest || echo "(backtest could not run this week)"
            echo
            python -m oracle.usage || echo "(usage meter unavailable)"
            echo '```'
            echo
            echo "**Reading it:** a strategy earns trust only if it beats the baselines on"
            echo "bet-accuracy AND net Sharpe with a small p-value. The AI analyst row"
            echo "(\`llm (recorded)\`) is scored only on the days it actually called — a"
            echo "small bet count means the p-value is not meaningful yet. If there is no"
            echo "AI row, the DeepSeek analyst is not enabled (set repo variable"
            echo "\`ORACLE_ANALYST_PROVIDER=deepseek\` + secret \`DEEPSEEK_API_KEY\`)."
            echo
            echo "_Not investment advice — a probabilistic signal to weigh yourself._"
          } > digest.md
          cat digest.md

      - name: Open the digest issue (GitHub emails it to the mentioned user)
        run: |
          title="China Market Oracle — weekly digest ($(date -u +%F))"
          if ! gh issue create --repo "${{ github.repository }}" \
                --title "$title" --body-file digest.md --label digest 2>/tmp/err; then
            # A fresh repo may not have the 'digest' label yet — retry without it.
            if grep -qi "label" /tmp/err; then
              gh issue create --repo "${{ github.repository }}" \
                --title "$title" --body-file digest.md
            else
              cat /tmp/err >&2; exit 1
            fi
          fi
